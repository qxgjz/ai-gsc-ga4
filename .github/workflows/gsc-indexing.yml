name: GSC Indexing Check & Submit

on:
  schedule:
      # 每天UTC 02:00运行（北京时间10:00）
          - cron: '0 2 * * *'
            workflow_dispatch:
                # 允许手动触发

                jobs:
                  indexing-check:
                      runs-on: ubuntu-latest

                          steps:
                                - name: Checkout repository
                                        uses: actions/checkout@v4

                                              - name: Set up Python
                                                      uses: actions/setup-python@v5
                                                              with:
                                                                        python-version: '3.11'

                                                                              - name: Install dependencies
                                                                                      run: |
                                                                                                python -m pip install --upgrade pip
                                                                                                          pip install google-api-python-client google-auth
                                                                                                          
                                                                                                                - name: Create service account file
                                                                                                                        run: |
                                                                                                                                  echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" > service-account.json
                                                                                                                                            echo "Service account file created"
                                                                                                                                            
                                                                                                                                                  - name: Run GSC indexing check
                                                                                                                                                          env:
                                                                                                                                                                    GOOGLE_APPLICATION_CREDENTIALS: service-account.json
                                                                                                                                                                              REPORT_OUTPUT_DIR: reports
                                                                                                                                                                                      run: |
                                                                                                                                                                                                python gsc_indexer.py
                                                                                                                                                                                                
                                                                                                                                                                                                      - name: Upload reports
                                                                                                                                                                                                              uses: actions/upload-artifact@v4
                                                                                                                                                                                                                      with:
                                                                                                                                                                                                                                name: gsc-indexing-report
                                                                                                                                                                                                                                          path: reports/
                                                                                                                                                                                                                                                    retention-days: 30
                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                          - name: Send notification (optional)
                                                                                                                                                                                                                                                                  if: always()
                                                                                                                                                                                                                                                                          run: |
                                                                                                                                                                                                                                                                                    echo "GSC indexing check completed"
                                                                                                                                                                                                                                                                                              echo "Check the artifacts for detailed reports"
                                                                                                                                                                                                                                                                                              
