name: GSC Indexing Check and Submit

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  indexing-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Create service account file (using Python to preserve JSON format)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python -c "
          import os, json
          sa_json = os.environ.get('GOOGLE_SERVICE_ACCOUNT_JSON', '')
          if not sa_json:
              print('ERROR: GOOGLE_SERVICE_ACCOUNT_JSON is empty')
              exit(1)
          try:
              data = json.loads(sa_json)
              with open('service-account.json', 'w') as f:
                  json.dump(data, f, indent=2)
              print('Service account file created successfully')
              print(f'Client email: {data.get(\"client_email\", \"N/A\")}')
          except json.JSONDecodeError as e:
              print(f'ERROR: Invalid JSON in GOOGLE_SERVICE_ACCOUNT_JSON: {e}')
              print(f'First 200 chars: {sa_json[:200]}')
              exit(1)
          "

      - name: Run GSC indexing check
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account.json
          REPORT_OUTPUT_DIR: reports
        run: |
          python gsc_indexer.py

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: gsc-indexing-report
          path: reports/
          retention-days: 30
